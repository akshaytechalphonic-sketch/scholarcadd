upstream frontend_upstream {
    server frontend:3000;
}

upstream phpfpm {
    server backend:9000;
}

# Redirect www to non-www
server {
    listen 80;
    server_name www.scholaracad.com;
    return 301 http://scholaracad.com$request_uri;
}

# Frontend — scholaracad.com (default)
server {
    listen 80 default_server;
    server_name scholaracad.com localhost _;

    # API routes go to backend (Laravel)
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
        
        location ~ \.php$ {
            fastcgi_pass phpfpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Everything else goes to frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# Backend — knowledgeadmin.scholaracad.com
server {
    listen 80;
    server_name knowledgeadmin.scholaracad.com;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass phpfpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
