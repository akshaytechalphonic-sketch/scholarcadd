<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/knowledgeadmin.scholaracad.com/public_html 
    ServerName knowledgeadmin.scholaracad.com 

    <Directory /var/www/knowledgeadmin.scholaracad.com/public_html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header unset X-Powered-By
        Header unset X-Generator
        Header unset X-Pingback
        Header unset X-Drupal-Cache
        Header unset X-Laravel
        Header unset X-Runtime
        Header unset X-Backend-Server
        Header unset X-WP-JSON
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error-beah-psi.log
    CustomLog ${APACHE_LOG_DIR}/access-beah-psi.log combined
    SSLEngine on
    #SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    #SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
    SSLCertificateFile      /etc/apache2/KSSL/knowledgeadmin.scholaracad.com-certificate.pem
    SSLCertificateKeyFile   /etc/apache2/KSSL/knowledgeadmin.scholaracad.com-Priv.pem
    SSLCertificateChainFile /etc/apache2/KSSL/knowledgeadmin.scholaracad.com-intermediate.pem

    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
      SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>

</VirtualHost>
