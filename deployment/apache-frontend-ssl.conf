<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/scholaracad.com/ScholarAcadNextjs
    ServerName scholaracad.com
    ServerAlias www.scholaracad.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Forward all traffic to Next.js
    #ProxyPass / http://127.0.0.1:3000/
    #ProxyPassReverse / http://127.0.0.1:3000/ 

    <Proxy "balancer://nextjs_cluster">
        BalancerMember http://127.0.0.1:3000
        BalancerMember http://127.0.0.1:3002
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass / balancer://nextjs_cluster/
    ProxyPassReverse / balancer://nextjs_cluster

    #<Directory /var/www/scholaracad.com/ScholarAcadNextjs>
    #    Options Indexes FollowSymLinks
    #    AllowOverride All
    #    Require all granted
    #</Directory>

    <IfModule mod_headers.c>
        Header unset X-Powered-By
        Header unset X-Generator
        Header unset X-Pingback
        Header unset X-Drupal-Cache
        Header unset X-Laravel
        Header unset X-Runtime
        Header unset X-Backend-Server
        Header unset X-WP-JSON
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error-beah-psi.log
    CustomLog ${APACHE_LOG_DIR}/access-beah-psi.log combined
    SSLEngine on
    #SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    #SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
    SSLCertificateFile      /etc/apache2/SSL/scholaracad.com-certificate.pem
    SSLCertificateKeyFile   /etc/apache2/SSL/scholaracad.com-PrivateKey.pem
    SSLCertificateChainFile /etc/apache2/SSL/scholaracad.com-intermediate.pem

    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
      SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>

</VirtualHost>
